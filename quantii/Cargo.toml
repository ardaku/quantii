[package]
name = "quantii"
edition = "2024"

[lib]
name = "quantii"
path = "src/lib.rs"

[[bin]]
name = "quantii"
path = "src/main.rs"

[dependencies.ardaku]
git = "https://github.com/ardaku/ardaku.git"
rev = "7da6ce78a26a8f704b9c95d94cab4bd1c84c80e0" # from branch "stable"
version = "0.1"

[dependencies.novusk]
git = "https://github.com/ardaku/novusk.git"
rev = "e2ae773bd8a700a45792f20b8f1077ab42655fcb" # from branch "quantii-patches"
version = "3.0"
features = ["custom_config", "hifive", "rpi3"]
